[files]
extend-exclude = [
  # autogenerated
  "*.patch",
  # signing keys
  "anda/terra/gpg-keys/",
  "*.keyring",
  # ffmpeg codec name lists (anull, tak, ...)
  "anda/multimedia/ffmpeg/enable_*",
  # upstream license text and man pages
  "anda/fonts/sipa/SIPA-LICENSE",
  "anda/lib/mesa*/Mesa-MLAA-License-Clarification-Email.txt",
  "*.[1-9]",
]

[default.extend-words]
# license IDs like CC-BY-NC-ND-4.0
ND = "ND"
# GObject introspection .gir files and gir-1.0 dirs
gir = "gir"
# ChromeOS packages (flashrom-cros, alsa-ucm-cros, ...)
cros = "cros"
# osu!lazer
lazer = "lazer"
# HD Audio (coreboot-utils hda-decoder)
hda = "hda"
# Python certifi package
certifi = "certifi"
# Rust ratatui crate
ratatui = "ratatui"
# Aylur's GTK Shell
ags = "ags"
# Helium browser app ID net.imput.helium
imput = "imput"
# Go module github.com/yhat/scrape
yhat = "yhat"
# Mesa zink driver
zink = "zink"
# sord library (audacity BuildRequires)
sord = "sord"
# Microsoft Terms of Use file (xonedo)
TOU = "TOU"
# ambient light sensor (wluma)
ALS = "ALS"
# config.mak build files
mak = "mak"
# plan9port tools
tpic = "tpic"
grap = "grap"
# gitoxide binary
ein = "ein"
# lomiri frame include dir
oif = "oif"
# Windows ClearType font files CONSOL*.TTF / CONSTAN*.TTF
CONSOL = "CONSOL"
CONSTAN = "CONSTAN"
# names: Tien Do Nam (localsend)
Nam = "Nam"
# sed "$!ba" in glewmx and a version hash in terra-obsolete
ba = "ba"
# "XDG thumbnailers" is correct
thumbnailers = "thumbnailers"
# stardust tool name
simular = "simular"
# nim-nightly old name in Obsoletes
nighlty = "nighlty"
# valid spelling in broadcom-wl
Recomment = "Recomment"

# translations in .desktop and .metainfo files
# Indonesian
populer = "populer"
# Romanian
populare = "populare"
distractiv = "distractiv"
# Spanish
Requiere = "Requiere"
# French
sur = "sur"
presse = "presse"
# Portuguese
momento = "momento"
limite = "limite"
oficial = "oficial"
# Polish
Nowe = "Nowe"

[default.extend-identifiers]
# packager identifier
L1oly = "L1oly"
# packager identifier
LaVey = "LaVey"
# libell-devel BuildRequires
libell = "libell"
# coreboot cse_fpt tool
cse_fpt = "cse_fpt"
# srctools src_dump_parms binary
src_dump_parms = "src_dump_parms"
# nvcc.profile "-IINCLUDE_DIR"
IINCLUDE_DIR = "IINCLUDE_DIR"
