name: JSON Build
permissions:
  contents: read
  attestations: write
  artifact-metadata: write
  id-token: write
on:
  workflow_call:
    inputs:
      packages:
        description: "Packages to Build"
        required: true
        type: string
      publish:
        description: "Whether the package should be published"
        required: false
        type: boolean
        default: true
      custom_builder:
        description: "Custom Builder"
        required: false
        type: string
        default: ""
      bust_cache:
        description: "Whether to bust the cache"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to Build"
        required: true
        type: string
      publish:
        description: "Whether the package should be published"
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        pkg: ${{ fromJson(inputs.packages) }}
        version: ["rawhide"]
      fail-fast: false
    runs-on: ${{ inputs.custom_builder && inputs.custom_builder || (matrix.pkg.arch == 'aarch64' && matrix.pkg.labels['large']) && format('cirun-arm64-lg--{0}', github.run_id) || matrix.pkg.arch == 'aarch64' && 'ubuntu-22.04-arm' || matrix.pkg.labels['large'] && format('cirun-x86-64-lg--{0}', github.run_id) || 'ubuntu-22.04' }}
    container:
      image: ghcr.io/terrapkg/builder:f${{ matrix.version }}
      options: --cap-add=SYS_ADMIN --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up git repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure sccache
        id: sccache
        if: ${{ contains(matrix.pkg.labels.sccache, '1') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCCACHE_GHA_VERSION: ${{ matrix.version }}-${{ matrix.pkg.arch }}-${{ matrix.pkg.pkg }}
          SCCACHE_GHA_CACHE_FROM: ${{ matrix.version }}-${{ matrix.pkg.arch }}-${{ matrix.pkg.pkg }}
        with:
          script: |
            const script = require('./.github/scripts/configure-sccache.js')
            await script({github, context, core, exec})

      - name: CI Setup Script
        if: ${{ !contains(matrix.pkg.labels, 'mock') }}
        run: |
          dir=$(dirname ${{ matrix.pkg.pkg }})
          if [ -f $dir/ci_setup.rhai ]; then
            anda run $dir/ci_setup.rhai --labels script_path=$dir/ci_setup.rhai
          fi

      - name: Install Build Dependencies
        if: ${{ matrix.pkg.labels.mock != '1' }}
        run: |
          dir=$(dirname ${{ matrix.pkg.pkg }})
          dnf5 builddep -y ${dir}/*.spec

      - name: Build with Andaman
        run: anda build -D "vendor Terra" -D "__python %{__python3}" ${{ matrix.pkg.pkg }} -c terra-${{ matrix.version }}-${{ matrix.pkg.arch }} ${{ !matrix.pkg.labels.mock == '1' && '-rrpmbuild' || '' }} ${{ matrix.pkg.labels.offline == '1' && '--no-network' || '' }}

      - name: Report Cache Summary
        if: steps.sccache.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require('./.github/scripts/sccache-stats.js')
            await script({github, context, core, exec})

      - name: Generating artifact name
        id: art
        run: |
          NAME=${{ matrix.pkg.pkg }}-${{ matrix.pkg.arch }}-${{ matrix.version }}
          x=${NAME//\//@}
          case "${{ matrix.pkg.pkg }}" in
            anda/system/nvidia/*) x="driver-nvidia-$x" ;;
            anda/system/nvidia-580/*) x="driver-nvidia-580-$x" ;;
          esac
          echo "name=$x" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.art.outputs.name }}
          compression-level: 0 # The RPMs are already compressed :p
          path: |
            anda-build/rpm/rpms/*
            anda-build/rpm/srpm/*

      - name: Upload packages to subatomic
        if: inputs.publish && !startsWith(matrix.pkg.pkg, 'anda/system/nvidia/') && !startsWith(matrix.pkg.pkg, 'anda/system/nvidia-580/')
        run: |
          subrepo="${{ matrix.pkg.labels.subrepo }}"
          subatomic-cli upload --prune \
            --server https://subatomic.fyralabs.com \
            --token ${{ secrets.SUBATOMIC_TOKEN }} \
            terra${{ matrix.version }}${{ matrix.pkg.labels['subrepo'] && '-$subrepo' || '' }} anda-build/rpm/rpms/*

      - name: Upload source packages to subatomic
        if: inputs.publish && !startsWith(matrix.pkg.pkg, 'anda/system/nvidia/') && !startsWith(matrix.pkg.pkg, 'anda/system/nvidia-580/') && matrix.pkg.labels['no_upload_srpms'] != '1'
        run: |
          subrepo="${{ matrix.pkg.labels.subrepo }}"
          subatomic-cli upload --prune \
            --server https://subatomic.fyralabs.com \
            --token ${{ secrets.SUBATOMIC_TOKEN }} \
            terra${{ matrix.version }}${{ matrix.pkg.labels['subrepo'] && '-$subrepo' || '' }}-source anda-build/rpm/srpm/*

      - name: Attest build provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            anda-build/rpm/rpms/*
            anda-build/rpm/srpm/*

      - name: Notify Madoguchi (Success)
        if: inputs.publish && success()
        run: ./.github/workflows/mg.sh true "${{matrix.pkg.pkg}}" "${{matrix.version}}" "${{matrix.pkg.arch}}" "${{github.run_id}}" "${{secrets.MADOGUCHI_JWT}}" "$GITHUB_SHA"
      - name: Notify Madoguchi (Failure)
        if: inputs.publish && (cancelled() || failure())
        run: ./.github/workflows/mg.sh false "${{matrix.pkg.pkg}}" "${{matrix.version}}" "${{matrix.pkg.arch}}" "${{github.run_id}}" "${{secrets.MADOGUCHI_JWT}}" "$GITHUB_SHA"

      - name: Create NVIDIA build success marker
        if: success() && (startsWith(matrix.pkg.pkg, 'anda/system/nvidia/') || startsWith(matrix.pkg.pkg, 'anda/system/nvidia-580/'))
        run: touch nvidia-build-success

      - name: Upload NVIDIA build success marker
        if: success() && (startsWith(matrix.pkg.pkg, 'anda/system/nvidia/') || startsWith(matrix.pkg.pkg, 'anda/system/nvidia-580/'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ready-${{ steps.art.outputs.name }}
          path: nvidia-build-success
          if-no-files-found: error

  # Keep NVIDIA driver packages out of the repository until every build in their folders succeeds.
  publish-nvidia:
    needs: build
    if: always() && !cancelled() && inputs.publish && (contains(inputs.packages, 'anda/system/nvidia/') || contains(inputs.packages, 'anda/system/nvidia-580/'))
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/terrapkg/builder:frawhide
      options: --cap-add=SYS_ADMIN --privileged
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*driver-nvidia*-rawhide'
          merge-multiple: false
          path: ./artifacts

      - name: Upload NVIDIA packages to subatomic
        env:
          PACKAGES: ${{ inputs.packages }}
          SUBATOMIC_TOKEN: ${{ secrets.SUBATOMIC_TOKEN }}
          VERSION: rawhide
        run: |
          set -euo pipefail
          printf '%s\n' "$PACKAGES" > packages.json
          mkdir -p nvidia-upload/rpms nvidia-upload/srpms

          for group in nvidia nvidia-580; do
            if [[ "$group" == "nvidia" ]]; then
              folder="anda/system/nvidia/"
            else
              folder="anda/system/nvidia-580/"
            fi
            mapfile -t builds < <(jq -r --arg folder "$folder" '[.[] | select(.pkg | startswith($folder)) | [.pkg, .arch, (.labels.no_upload_srpms // 0 | tostring)]] | unique[] | @tsv' packages.json)
            ((${#builds[@]} > 0)) || continue

            complete=true
            for build in "${builds[@]}"; do
              IFS=$'\t' read -r pkg arch no_upload_srpms <<< "$build"
              artifact_pkg=${pkg//\//@}
              artifact="driver-${group}-${artifact_pkg}-${arch}-${VERSION}"
              if [[ ! -f "artifacts/ready-${artifact}/nvidia-build-success" || ! -d "artifacts/${artifact}" ]]; then
                echo "Not publishing $group: $pkg ($arch) did not complete successfully" >&2
                complete=false
                break
              fi
              if ! find "artifacts/${artifact}/rpms" -maxdepth 1 -type f -name '*.rpm' -print -quit | grep -q .; then
                echo "Not publishing $group: no RPMs found for $pkg ($arch)" >&2
                complete=false
                break
              fi
              if [[ "$no_upload_srpms" != "1" ]] && ! find "artifacts/${artifact}/srpm" -maxdepth 1 -type f -name '*.rpm' -print -quit | grep -q .; then
                echo "Not publishing $group: no source RPM found for $pkg ($arch)" >&2
                complete=false
                break
              fi
            done
            [[ "$complete" == "true" ]] || continue

            echo "All packages in $group built successfully; including them in the repository upload."
            for build in "${builds[@]}"; do
              IFS=$'\t' read -r pkg arch no_upload_srpms <<< "$build"
              artifact_pkg=${pkg//\//@}
              artifact="artifacts/driver-${group}-${artifact_pkg}-${arch}-${VERSION}"
              find "$artifact/rpms" -maxdepth 1 -type f -name '*.rpm' -exec cp -n {} nvidia-upload/rpms/ \;
              if [[ "$no_upload_srpms" != "1" ]]; then
                find "$artifact/srpm" -maxdepth 1 -type f -name '*.rpm' -exec cp -n {} nvidia-upload/srpms/ \;
              fi
            done
          done

          shopt -s nullglob
          rpms=(nvidia-upload/rpms/*.rpm)
          srpms=(nvidia-upload/srpms/*.rpm)
          if ((${#rpms[@]} == 0)); then
            echo "No NVIDIA RPMs were collected for upload" >&2
            exit 1
          fi

          subatomic-cli upload --prune \
            --server https://subatomic.fyralabs.com \
            --token "$SUBATOMIC_TOKEN" \
            "terra${VERSION}-nvidia" "${rpms[@]}"

          if ((${#srpms[@]} > 0)); then
            subatomic-cli upload --prune \
              --server https://subatomic.fyralabs.com \
              --token "$SUBATOMIC_TOKEN" \
              "terra${VERSION}-nvidia-source" "${srpms[@]}"
          fi
