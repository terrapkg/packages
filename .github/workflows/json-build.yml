name: JSON Build
permissions:
  contents: read
  attestations: write
  artifact-metadata: write
  id-token: write
on:
  workflow_call:
    inputs:
      packages:
        description: "Packages to Build"
        required: true
        type: string
      unit_id:
        description: "Independent build group/package identifier"
        required: false
        type: string
        default: ""
      publish:
        description: "Whether the package should be published"
        required: false
        type: boolean
        default: true
      custom_builder:
        description: "Custom Builder"
        required: false
        type: string
        default: ""
      bust_cache:
        description: "Whether to bust the cache"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to Build"
        required: true
        type: string
      unit_id:
        description: "Independent build group/package identifier"
        required: false
        type: string
        default: ""
      publish:
        description: "Whether the package should be published"
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        pkg: ${{ fromJson(inputs.packages) }}
        version: ["rawhide"]
      fail-fast: false
    runs-on: ${{ inputs.custom_builder && inputs.custom_builder || (matrix.pkg.arch == 'aarch64' && matrix.pkg.labels['large']) && format('cirun-arm64-lg--{0}', github.run_id) || matrix.pkg.arch == 'aarch64' && 'ubuntu-22.04-arm' || matrix.pkg.labels['large'] && format('cirun-x86-64-lg--{0}', github.run_id) || 'ubuntu-22.04' }}
    container:
      image: ghcr.io/terrapkg/builder:f${{ matrix.version }}
      options: --cap-add=SYS_ADMIN --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up git repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure sccache
        id: sccache
        if: ${{ contains(matrix.pkg.labels.sccache, '1') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCCACHE_GHA_VERSION: ${{ matrix.version }}-${{ matrix.pkg.arch }}-${{ matrix.pkg.pkg }}
          SCCACHE_GHA_CACHE_FROM: ${{ matrix.version }}-${{ matrix.pkg.arch }}-${{ matrix.pkg.pkg }}
        with:
          script: |
            const script = require('./.github/scripts/configure-sccache.js')
            await script({github, context, core, exec})

      - name: CI Setup Script
        if: ${{ !contains(matrix.pkg.labels, 'mock') }}
        run: |
          dir=$(dirname ${{ matrix.pkg.pkg }})
          if [ -f $dir/ci_setup.rhai ]; then
            anda run $dir/ci_setup.rhai --labels script_path=$dir/ci_setup.rhai
          fi

      - name: Install Build Dependencies
        if: ${{ matrix.pkg.labels.mock != '1' }}
        run: |
          dir=$(dirname ${{ matrix.pkg.pkg }})
          dnf5 builddep -y ${dir}/*.spec

      - name: Build with Andaman
        run: anda build -D "vendor Terra" -D "__python %{__python3}" ${{ matrix.pkg.pkg }} -c terra-${{ matrix.version }}-${{ matrix.pkg.arch }} ${{ !matrix.pkg.labels.mock == '1' && '-rrpmbuild' || '' }} ${{ matrix.pkg.labels.offline == '1' && '--no-network' || '' }}

      - name: Report Cache Summary
        if: steps.sccache.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require('./.github/scripts/sccache-stats.js')
            await script({github, context, core, exec})

      - name: Generating artifact name
        id: art
        env:
          UNIT_ID: ${{ inputs.unit_id }}
          PACKAGE_GROUP: ${{ matrix.pkg.labels.group }}
          PACKAGE_NAME: ${{ matrix.pkg.pkg }}
          PACKAGE_ARCH: ${{ matrix.pkg.arch }}
          BUILD_VERSION: ${{ matrix.version }}
        run: |
          safe_name() { printf '%s' "$1" | base64 -w0 | tr '+/' '-_' | tr -d '='; }
          if [[ -z "$UNIT_ID" ]]; then
            if [[ -n "$PACKAGE_GROUP" ]]; then
              UNIT_ID="group-$(safe_name "$PACKAGE_GROUP")"
            else
              UNIT_ID="package-$(safe_name "$PACKAGE_NAME")"
            fi
          fi
          NAME="$UNIT_ID-$PACKAGE_NAME-$PACKAGE_ARCH-$BUILD_VERSION"
          x=${NAME//\//@}
          echo "name=$x" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.art.outputs.name }}
          compression-level: 0 # The RPMs are already compressed :p
          overwrite: true
          path: |
            anda-build/rpm/rpms/*
            anda-build/rpm/srpm/*

      - name: Attest build provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            anda-build/rpm/rpms/*
            anda-build/rpm/srpm/*

      - name: Notify Madoguchi (Success)
        if: inputs.publish && success()
        run: ./.github/workflows/mg.sh true "${{matrix.pkg.pkg}}" "${{matrix.version}}" "${{matrix.pkg.arch}}" "${{github.run_id}}" "${{secrets.MADOGUCHI_JWT}}" "$GITHUB_SHA"
      - name: Notify Madoguchi (Failure)
        if: inputs.publish && (cancelled() || failure())
        run: ./.github/workflows/mg.sh false "${{matrix.pkg.pkg}}" "${{matrix.version}}" "${{matrix.pkg.arch}}" "${{github.run_id}}" "${{secrets.MADOGUCHI_JWT}}" "$GITHUB_SHA"

  publish-artifacts:
    needs: build
    if: inputs.publish
    runs-on: arc-runner-set
    container:
      image: ghcr.io/terrapkg/builder:frawhide
      options: --cap-add=SYS_ADMIN --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.unit_id != '' && format('{0}-*', inputs.unit_id) || '*' }}
          path: ./artifacts
          merge-multiple: false
          if-no-artifact-found: ignore

      - name: Publish build unit RPMs and source RPMs
        env:
          PACKAGES_JSON: ${{ inputs.packages }}
          SUBATOMIC_TOKEN: ${{ secrets.SUBATOMIC_TOKEN }}
          BUILD_VERSION: rawhide
          UNIT_ID: ${{ inputs.unit_id }}
        run: python3 .github/scripts/publish-build-unit.py
