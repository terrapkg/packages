name: Redistribute Nightly Packages
permissions:
  contents: read

concurrency:
  group: redistribute-nightly
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 3 * * 2"
  workflow_dispatch:

jobs:
  redistribute:
    permissions:
      contents: write
    runs-on: arc-runner-set
    container:
      image: ghcr.io/terrapkg/builder:frawhide
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_AUTHENTICATION_KEY }}

      - name: Install SSH signing key & Set up git repository
        run: |
          mkdir -p ${{ runner.temp }}
          echo "${{ secrets.SSH_SIGNING_KEY }}" > ${{ runner.temp }}/signing_key
          chmod 0700 ${{ runner.temp }}/signing_key
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Redistribute Nightly Packages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          nightly_pattern = re.compile(
              r"(?P<prefix>(?:^|(?<=\{))[ \t]*nightly[ \t]*=[ \t]*)"
              r"(?P<quote>[\"']?)(?P<value>\d+)(?P=quote)",
              re.MULTILINE,
          )
          packages = []
          for path in sorted(Path("anda").rglob("anda.hcl")):
              text = path.read_text()
              matches = [match for match in nightly_pattern.finditer(text) if int(match.group("value")) != 0]
              if matches:
                  packages.append((path, text))

          assigned = [0, 0, 0, 0]
          package_index = [0]
          for path, text in packages:
              def assign_run(match):
                  if int(match.group("value")) == 0:
                      return match.group(0)
                  run = package_index[0] % 4
                  package_index[0] += 1
                  assigned[run] += 1
                  return (
                      f"{match.group('prefix')}{match.group('quote')}"
                      f"{run + 1}{match.group('quote')}"
                  )

              updated = nightly_pattern.sub(assign_run, text)
              if updated != text:
                  path.write_text(updated)

          if not packages:
              raise SystemExit("No packages with nightly != 0 found")
          print(f"Assigned {package_index[0]} nightly packages across runs: {assigned}")
          PY

      - name: Save
        run: |
          if [[ `git status --porcelain` ]]; then
            git config user.name "Raboneko"
            git config user.email "raboneko@fyralabs.com"
            git config gpg.format "ssh"
            git config user.signingkey "${{ runner.temp }}/signing_key"
            msg="chore(nightly): redistribute packages across update runs"
            git add anda
            git commit -S -m "$msg"
            git format-patch --stdout HEAD^ > nightly.patch
            copy_over () {
              git checkout "$1"
              git apply --check nightly.patch
              git apply nightly.patch
              git add anda
              if [[ `git status --porcelain` ]]; then
                git commit -S -m "$msg"
              fi
            }
            copy_over f45
            copy_over f44
            copy_over f43
            copy_over el10
            git checkout frawhide
            git push -u origin --all
          fi
