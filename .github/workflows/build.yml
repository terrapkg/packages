name: Manual Builds
permissions:
  contents: read
  attestations: write
  artifact-metadata: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to Build"
        required: true
      custom_builder:
        description: "Custom Builder"
        required: false
        default: ""
      architecture:
        description: "Architectures"
        required: false
        default: ""
        type: string

run-name: ${{ inputs.packages }}

jobs:
  manifest:
    outputs:
      build_units: ${{ steps.parsing.outputs.build_units }}
    runs-on: arc-runner-set
    container:
      image: ghcr.io/terrapkg/builder:frawhide
      options: --cap-add=SYS_ADMIN --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "Raboneko"
          git config user.email "raboneko@fyralabs.com"
      - name: Parse Input
        id: parsing
        env:
          ARCHITECTURES: ${{ inputs.architecture }}
          CUSTOM_BUILDER: ${{ inputs.custom_builder }}
        run: |
          for pkg in ${{ inputs.packages }}; do
            touch anda/$pkg/.build
          done
          git add --all
          git commit -a -m "tmp"

          args=()
          if [[ -n "$ARCHITECTURES" ]]; then
            while IFS= read -r arch; do
              [[ -z "$arch" ]] || args+=(--arch "$arch")
            done < <(printf '%s' "$ARCHITECTURES" | tr '[:space:]' '\n')
          elif [[ -n "$CUSTOM_BUILDER" ]]; then
            args+=(--unique-packages)
          fi
          anda ci "${args[@]}" >> "$GITHUB_OUTPUT"

  build:
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJson(needs.manifest.outputs.build_units) }}
    uses: ./.github/workflows/json-build.yml
    secrets: inherit
    with:
      packages: ${{ toJSON(matrix.unit.packages) }}
      unit_id: ${{ matrix.unit.name }}
      custom_builder: ${{ inputs.custom_builder }}
