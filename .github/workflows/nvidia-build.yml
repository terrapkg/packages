name: NVIDIA Build
permissions:
  contents: read
  attestations: write
  artifact-metadata: write
  id-token: write
on:
  workflow_call:
    inputs:
      packages:
        description: "Selected NVIDIA builds as JSON; each touched folder expands to all configured architectures"
        required: true
        type: string
      publish:
        description: "Whether the package should be published"
        required: false
        type: boolean
        default: true
      custom_builder:
        description: "Unsupported for full multiarchitecture driver groups; leave empty"
        required: false
        type: string
        default: ""
      bust_cache:
        description: "Whether to bust the cache"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      packages:
        description: "Selected NVIDIA builds as JSON; each touched folder expands to all configured architectures"
        required: true
        type: string
      publish:
        description: "Whether the package should be published"
        required: false
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/terrapkg/builder:frawhide
    outputs:
      packages: ${{ steps.groups.outputs.packages }}
      blocked_groups: ${{ steps.groups.outputs.blocked_groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Expand complete driver groups
        id: groups
        env:
          PACKAGES: ${{ inputs.packages }}
          CUSTOM_BUILDER: ${{ inputs.custom_builder }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash .github/scripts/prepare-driver-groups.sh

  build:
    needs: prepare
    if: needs.prepare.outputs.packages != '[]'
    uses: ./.github/workflows/json-build.yml
    secrets: inherit
    with:
      packages: ${{ needs.prepare.outputs.packages }}
      publish: ${{ inputs.publish }}
      custom_builder: ${{ inputs.custom_builder }}
      bust_cache: ${{ inputs.bust_cache }}
      driver_group: true

  publish-nvidia:
    needs: [prepare, build]
    if: always() && !cancelled() && needs.prepare.result == 'success' && inputs.publish && (contains(inputs.packages, 'anda/system/nvidia/') || contains(inputs.packages, 'anda/system/nvidia-580/'))
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/terrapkg/builder:frawhide
      options: --cap-add=SYS_ADMIN --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*driver-nvidia*-rawhide'
          merge-multiple: false
          path: ./artifacts

      - name: Upload complete NVIDIA driver groups to subatomic
        shell: bash
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          BLOCKED_GROUPS: ${{ needs.prepare.outputs.blocked_groups }}
          SUBATOMIC_TOKEN: ${{ secrets.SUBATOMIC_TOKEN }}
          VERSION: rawhide
        run: bash .github/scripts/publish-nvidia.sh
